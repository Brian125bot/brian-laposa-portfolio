<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#09090b"/>
  <!-- Pilot/Robot Container -->
  <rect x="100" y="50" width="200" height="200" rx="14" fill="#18181b" stroke="#27272a" stroke-width="2"/>

  <!-- Robot Head / Drone structure -->
  <rect x="150" y="80" width="100" height="60" rx="30" fill="#27272a" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Glowing Eyes -->
  <circle cx="175" cy="110" r="10" fill="#38bdf8"/>
  <circle cx="225" cy="110" r="10" fill="#38bdf8"/>
  <rect x="170" y="105" width="10" height="10" fill="#c084fc" opacity="0.5"/>
  <rect x="220" y="105" width="10" height="10" fill="#c084fc" opacity="0.5"/>

  <!-- Mouth / Data flow -->
  <rect x="175" y="150" width="50" height="8" rx="4" fill="#8b5cf6"/>
  <rect x="180" y="165" width="40" height="4" rx="2" fill="#a78bfa"/>
  <rect x="185" y="175" width="30" height="4" rx="2" fill="#c084fc"/>

  <!-- Wings / Propellers / Pilot aspects -->
  <path d="M140 110 L100 90 L120 130 Z" fill="#27272a" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M260 110 L300 90 L280 130 Z" fill="#27272a" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Radar / Signal / Code connection -->
  <path d="M200 40 A40 40 0 0 1 240 80" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M200 20 A60 60 0 0 1 260 80" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-dasharray="2 4"/>

  <!-- Bottom Data Processing nodes -->
  <rect x="130" y="200" width="140" height="30" rx="8" fill="#27272a"/>
  <circle cx="150" cy="215" r="5" fill="#38bdf8"/>
  <circle cx="175" cy="215" r="5" fill="#a78bfa"/>
  <circle cx="200" cy="215" r="5" fill="#c084fc"/>
  <circle cx="225" cy="215" r="5" fill="#e879f9"/>
  <circle cx="250" cy="215" r="5" fill="#f472b6"/>

  <!-- AI Sparkles -->
  <path d="M315 45 L318 32 L331 29 L318 26 L315 13 L312 26 L299 29 L312 32 Z" fill="#c084fc"/>
  <path d="M85 245 L87 237 L95 235 L87 233 L85 225 L83 233 L75 235 L83 237 Z" fill="#38bdf8"/>
</svg>
